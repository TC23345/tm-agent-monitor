appId: com.taylormade.agent-monitor
productName: TaylorMade Agents
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - "!**/*.map"
# koffi and node-pty are native modules loaded at runtime — they must live
# outside the asar (a .node binary inside an asar cannot be loaded).
asarUnpack:
  - "**/node_modules/koffi/**"
  - "**/node_modules/node-pty/**"
# Both native deps ship prebuilt binaries (koffi its own dispatcher, node-pty
# NAPI prebuilds under prebuilds/win32-*), so nothing needs node-gyp. Left on,
# the rebuild step compiles node-pty from source and fails on machines without
# Spectre-mitigated VS libraries (MSB8040).
npmRebuild: false
# Ship the tray/app/provider PNGs so the installed app finds them at process.resourcesPath.
extraResources:
  - from: resources
    to: .
    filter:
      - "*.png"
  - from: resources/providers
    to: providers
    filter:
      - "*.png"
  - from: hooks
    to: hooks
    filter:
      - bridge.mjs
      - focus-worker.mjs
      - report.mjs
      - install.mjs
  - from: src/native
    to: native
    filter:
      - win32.mjs
  # The shared hook runs in external Node, outside Electron's asar resolver.
  - from: node_modules/koffi
    to: native/node_modules/koffi
  - from: node_modules/@koromix/koffi-win32-x64
    to: native/node_modules/@koromix/koffi-win32-x64
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  artifactName: tm-agent-monitor-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TaylorMade Agents
portable:
  artifactName: tm-agent-monitor-${version}-portable.exe
# Auto-update feed: GitHub Releases on this repo. The repo must be PUBLIC so the
# app can read latest.yml without a token. (Make it public, or point this at a
# separate public releases repo to keep the code private.)
publish:
  provider: github
  owner: TC23345
  repo: tm-agent-monitor
  releaseType: release # publish directly (not a draft) so auto-update sees it
